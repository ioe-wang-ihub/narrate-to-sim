name: Source client tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: addons/narrate_to_sim/requirements-stock.txt
      - name: Check public distribution boundary
        run: python -I tools/check_public_source.py
      - name: Install pinned dependencies
        run: |
          python -I -m pip install --only-binary=:all: -r addons/narrate_to_sim/requirements-stock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m pip check
      - name: Test client and manifest
        working-directory: addons/narrate_to_sim
        run: python -I -m unittest discover -s tests -v
      - name: Exercise real authoring GUI without a simulator
        working-directory: addons/narrate_to_sim
        run: python -I tools/rehearse_stock_addon.py
